<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Lines</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div><p class="eyebrow">Tireless Transit</p><h1>Bus lines</h1></div>
        <div class="header-actions"><a class="button secondary" href="hub/chat.html">Open chat</a><a id="admin-bus-lines-link" class="button" href="admin/bus-lines/" hidden>Manage bus lines</a><a id="login-link" class="button secondary" href="login/">Log in</a><button id="logout-button" class="button secondary" type="button" hidden>Log out</button></div>
      </header>
      <section class="fleet" aria-labelledby="fleet-title">
        <div class="fleet-heading">
          <h2 id="fleet-title">Current fleet</h2>
          <button id="refresh-button" class="button secondary" type="button">Refresh</button>
        </div>
        <p id="loading-message" class="message">Loading bus lines…</p>
        <div id="bus-lines" class="bus-lines" aria-live="polite"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
