<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Log in · Tireless Transit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body><main class="auth-page"><section class="card" aria-labelledby="login-heading">
    <h1 id="login-heading">Log in</h1>
    <p>Manage your bus lines.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" maxlength="50" required autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" maxlength="20" required autocomplete="current-password" />
      <button type="submit">Log in</button>
      <p id="form-message" aria-live="polite"></p>
    </form>
    <p>New here? <a href="../register/">Create an account</a></p>
  </section></main>
  <script src="auth.js"></script>
</body>
</html>
